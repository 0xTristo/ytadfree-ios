name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "App/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build unsigned archive
        working-directory: App
        run: |
          xcodebuild -project YTAdFree.xcodeproj \
            -scheme YTAdFree \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/YTAdFree.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        working-directory: App
        run: |
          mkdir -p build/Payload
          cp -r build/YTAdFree.xcarchive/Products/Applications/YTAdFree.app build/Payload/
          cd build
          zip -r YTAdFree-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTAdFree-unsigned-ipa
          path: App/build/YTAdFree-unsigned.ipa
